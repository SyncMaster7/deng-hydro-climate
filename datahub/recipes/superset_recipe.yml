# DataHub ingestion — Apache Superset
# Source: deng-superset (internal Docker hostname)
# Ingests: dashboards, charts, dataset lineage back to gold.hydro_meteo
# Run: docker compose exec datahub-actions datahub ingest -c /datahub/recipes/superset_recipe.yml

pipeline_name: deng_superset

source:
  type: superset
  config:
    connect_uri: "http://superset:8088"
    username: "${SUPERSET_ADMIN_USER}"
    password: "${SUPERSET_ADMIN_PASSWORD}"
    # provider: db — default local DB auth (not LDAP/OAuth)
    provider: "db"
    stateful_ingestion:
      enabled: true

sink:
  type: datahub-rest
  config:
    server: "http://datahub-gms:8080"
