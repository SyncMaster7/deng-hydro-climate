version: 2

sources:
  - name: bronze
    schema: bronze
    tables:
      - name: hydro
        description: >
          Töötlemata hüdroloogilised vaatlused, mis on saadud Keskkonnaagentuuri
          f_hydroseire API-st. Üks rida ühe jaama, ajatempli ja mõõtmistüübi kohta
          (pikk formaat). Andmed katavad 76 hüdomeetrijaama ning sisaldavad veetaset,
          veetemperatuuri ja äravoolu tunnise granulaarsusega.
        columns:
          - name: id
            description: Asendusprimaarovõti, automaatselt suurenev.
          - name: jaam_kood
            description: >
              Hüdromeetrijaama kood (täisarv). Keskkonnaagentuuri määratud loomulik võti.
              Vastab väljale station_code tabelis ref.hydrometric_stations.
          - name: jaam_nimi
            description: Jaama lühinimi eesti keeles, nii nagu allikas API-s on esitatud.
          - name: jaam_taisnimi
            description: >
              Jaama täisnimi eesti keeles, mis sisaldab tavaliselt veekogu nime ja
              asukoha konteksti (nt "Võhandu jõgi Võõpsu").
          - name: valgala_nimi
            description: Jaama valgala (jõgikonna) nimi.
          - name: valgala_suurus_km2
            description: Valgala pindala ruutkilomeetrites.
          - name: kaugus_suudmest_km
            description: Kaugus jaamast jõe suudmeni kilomeetrites.
          - name: jaam_laiuskraad
            description: Jaama laiuskraad kümnendkraadides (WGS84).
          - name: jaam_pikkuskraad
            description: Jaama pikkuskraad kümnendkraadides (WGS84).
          - name: veekogu_nimi
            description: Jaama asukohas oleva veekogu (jõgi või järv) nimi.
          - name: timeline_ts_utc
            description: >
              Vaatluse ajatempel UTC-s (TIMESTAMPTZ). Kasutatakse peamise ajalise
              võtmena koos jaam_kood ja aegrida_nimi väljadega. Ärge kasutage seda
              välja kuupäevapõhiseks filtreerimiseks — kasutage timeline_ts_local.
          - name: timeline_ts_local
            description: >
              Vaatluse ajatempel Eesti kohalikus ajas (EET/EEST, UTC+2/UTC+3).
              Kasutage seda välja kuupäevapõhiseks filtreerimiseks, et vältida
              iga kohaliku päeva esimese 3 tunni kaotamist suveajal (EEST, UTC+3).
          - name: aegrida_nimi
            description: >
              Mõõtmistüübi identifikaator (aegrea nimi). Määrab, mida vaartus tähendab.
              Teadaolevad väärtused: "WL avg", "WL min", "WL max" (veetase cm-tes),
              "WT avg", "WT min", "WT max" (veetemperatuur °C-tes),
              "Äravool avg", "Äravool min", "Äravool max" (äravool m³/s-tes).
          - name: vaartus
            description: >
              Mõõdetud väärtus. Ühik ja tähendus sõltuvad väljast aegrida_nimi.
              Ranniku- ja kõrgusekorrektsiooni jaamade veetaseme väärtused on esitatud
              kohalikus Balti kõrgussüsteemis; EH2000 korrektsioon rakendatakse
              tabelis silver.hydro.
          - name: loaded_at
            description: Ajatempel, millal rida lisati bronze.hydro tabelisse Airflow ingest_hydro ülesande poolt.

      - name: meteo
        description: >
          Töötlemata meteoroloogilised vaatlused, mis on saadud Keskkonnaagentuuri
          f_kliima_tund API-st. Üks rida ühe jaama, kuupäeva, tunni ja meteoroloogilise
          elemendi kohta (pikk formaat). Andmed katavad 25 meteoroloogiajaama tunnise
          granulaarsusega. Avaldatakse igapäevase pakettina ligikaudu kell 05:01 EET
          eelmise päeva kohta.
        columns:
          - name: id
            description: Asendusprimaarovõti, automaatselt suurenev.
          - name: jaam_kood
            description: >
              Meteoroloogiajaama kood (tekst). Keskkonnaagentuuri määratud loomulik võti.
              Vastab väljale station_code tabelis ref.meteorological_stations.
          - name: jaam_nimi
            description: Jaama nimi eesti keeles, nii nagu allikas API-s on esitatud.
          - name: aasta
            description: Vaatluse aasta (täisarv). Esindab Eesti kohalikku aega.
          - name: kuu
            description: Vaatluse kuu (täisarv, 1–12). Esindab Eesti kohalikku aega.
          - name: paev
            description: Vaatluse kuupäev (täisarv, 1–31). Esindab Eesti kohalikku aega.
          - name: tund
            description: >
              Vaatluse tund (täisarv, 0–23). Esindab Eesti kohalikku aega (EET/EEST).
              Kombineeritakse väljaadega aasta, kuu ja paev, et koostada observation_ts
              tabelis silver.meteo, kasutades make_timestamptz koos ajavööndiga Europe/Tallinn.
          - name: vaartus
            description: >
              Mõõdetud väärtus. Ühik ja tähendus sõltuvad väljast element_kood.
              Inimloetavad kirjeldused ja ühikud on saadaval väljades element_nimi_eng
              ja element_yhik_eng, nii nagu allikas API-s on esitatud.
          - name: element_kood
            description: >
              Meteoroloogilise elemendi kood. Teadaolevad väärtused: PR1H (tunnine sademed, mm),
              TA (õhutemperatuur, °C), TAN1H (min õhutemperatuur, °C),
              TAX1H (max õhutemperatuur, °C), RH (suhteline õhuniiskus, %),
              PA0 (õhurõhk jaama tasemel, hPa), WS10M (tuule kiirus 10m kõrgusel, m/s),
              WSX1H (max tuuleiil, m/s), WD10M (tuule suund 10m kõrgusel, kraadides),
              SDUR1H (päikese paistmise kestus, minutites).
          - name: element_nimi_eng
            description: Meteoroloogilise elemendi inimloetav nimi inglise keeles, nii nagu allikas API-s on esitatud.
          - name: element_yhik_eng
            description: Elemendi mõõtühik inglise keeles, nii nagu allikas API-s on esitatud (nt "mm", "°C", "%").
          - name: avaandmed_ts
            description: >
              Avaandmete avaldamise ajatempel (TIMESTAMPTZ) — millal kirje tehti
              allikas API-s kättesaadavaks. Kajastab igapäevase paketi avaldamise aega
              (~05:01 EET). See ei ole vaatluse ajatempel.
          - name: loaded_at
            description: Ajatempel, millal rida lisati bronze.meteo tabelisse Airflow ingest_meteo ülesande poolt.

      - name: etl_log
        description: >
          Torujuhtme täitmise logi, mida kirjutavad kõik Airflow ülesanded hydro_meteo_pipeline
          DAG-is. Üks rida ühe ülesande täitmise kohta. Kasutatakse torujuhtme jälgimiseks,
          andmekvaliteedi kontrollimiseks ja sisestamisprobleemide diagnoosimisel.
        columns:
          - name: id
            description: Asendusprimaarovõti, automaatselt suurenev.
          - name: dag_id
            description: Airflow DAG-i identifikaator.
          - name: task_id
            description: Airflow ülesande identifikaator DAG-i sees.
          - name: target_date
            description: >
              Töödeldav andmekuupäev (mitte Airflow käivitamise kuupäev). Vastab
              data_interval_start miinus API viivituse nihke (API_LAG_DAYS = 3).
              NULL run_dbt ülesande puhul.
          - name: started_at
            description: Ajatempel, millal ülesande täitmine algas.
          - name: finished_at
            description: Ajatempel, millal ülesande täitmine lõppes.
          - name: rows_processed
            description: >
              Allikast saadud ridade arv (API vastuse read fetch-ülesannete puhul,
              faili read ingest-ülesannete puhul). NULL run_dbt puhul.
          - name: rows_loaded
            description: >
              Bronze tabelisse edukalt sisestatud ridade arv. NULL fetch-ülesannete
              ja run_dbt puhul (täidetakse ainult ingest-ülesannete poolt).
          - name: source_file
            description: Toorest JSON-failist kettal asuv tee, mille kirjutavad fetch-ülesanded ja loevad ingest-ülesanded.
          - name: status
            description: >
              Täitmise olek. Teadaolevad väärtused: running, success, error, triggered, skipped.
          - name: error_message
            description: Veakirjeldus, kui olek on error, muul juhul NULL.

  - name: ref
    schema: ref
    tables:
      - name: hydrometric_stations
      - name: meteorological_stations
      - name: station_proximity
