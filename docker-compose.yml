# deng-hydro-climate — docker-compose.yml
# Airflow 3.2.1 + dbt-postgres + pgduckdb analytics DB + Apache Superset + DataHub
# All passwords and secrets via .env — never hardcode here
#
# Ports in use:
#   5432  — analytics-db (PostgreSQL)
#   5433  — airflow-db (PostgreSQL)
#   5434  — superset-db (PostgreSQL)
#   8000  — FastAPI public REST API
#   8080  — Airflow UI + REST API
#   8088  — Superset UI
#   8090  — DataHub GMS (metadata REST API)
#   9002  — DataHub Frontend (UI)
#   9092  — Kafka broker
#   5435  — ckan-db (PostgreSQL)
#   5000  — CKAN UI (reverse-proxied via Caddy at ckan.deng.ee)
#   8983  — Solr (internal only)

x-airflow-common: &airflow-common
  build: ./docker/airflow
  restart: unless-stopped
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    AIRFLOW_CONN_ANALYTICS_DB: postgresql+psycopg2://${ANALYTICS_DB_USER}:${ANALYTICS_DB_PASSWORD}@analytics-db:5432/${ANALYTICS_DB_NAME}
    AIRFLOW_CONN_DATAHUB_REST_DEFAULT: datahub-rest://datahub-gms:8080
    DBT_ANALYTICS_HOST: analytics-db
    DBT_ANALYTICS_PORT: "5432"
    DBT_ANALYTICS_USER: ${ANALYTICS_DB_USER}
    DBT_ANALYTICS_PASSWORD: ${ANALYTICS_DB_PASSWORD}
    DBT_ANALYTICS_DB: ${ANALYTICS_DB_NAME}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./dbt_project:/opt/airflow/dbt_project
    - ./dbt_project/profiles.yml:/home/airflow/.dbt/profiles.yml:ro
    - ./ingestion:/opt/airflow/ingestion
    - ./seeds:/opt/airflow/seeds
    - /data/raw:/data/raw
    - /data/archive:/data/archive
    - ./datahub/artifacts:/opt/airflow/datahub/artifacts
    - ./datahub/recipes:/opt/airflow/datahub/recipes:ro
  depends_on:
    airflow-db:
      condition: service_healthy
  user: "${AIRFLOW_UID:-50000}:0"

volumes:
  # DataHub named volumes — persist DataHub internal state across restarts
  datahub-mysql:
  datahub-opensearch:
  datahub-broker:
  # CKAN named volumes — persist CKAN internal state across restarts
  ckan-db-data:
  ckan-solr-data:
  ckan-storage-data:

services:

  # ---------------------------------------------------------------------------
  # Analytics database — application data (hydro + climate)
  # ---------------------------------------------------------------------------
  analytics-db:
    image: pgduckdb/pgduckdb:16-v1.1.1
    container_name: deng-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ANALYTICS_DB_USER}
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      POSTGRES_DB: ${ANALYTICS_DB_NAME}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - /data/volumes/postgres_data:/var/lib/postgresql/data
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYTICS_DB_USER} -d ${ANALYTICS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Airflow metadata database — internal Airflow state only
  # ---------------------------------------------------------------------------
  airflow-db:
    image: postgres:16
    container_name: deng-airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5433:5432"
    volumes:
      - /data/volumes/airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Airflow init — runs once to migrate DB and create admin user
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: deng-airflow-init
    restart: "no"
    user: "50000:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow fab-db migrate
        airflow users create \
          --username ${AIRFLOW_ADMIN_USER} \
          --password ${AIRFLOW_ADMIN_PASSWORD} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email ${AIRFLOW_ADMIN_EMAIL} || true
    depends_on:
      airflow-db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Airflow API server — UI + REST API
  # ---------------------------------------------------------------------------
  airflow-apiserver:
    <<: *airflow-common
    container_name: deng-airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Airflow scheduler — evaluates DAGs and triggers tasks
  # ---------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: deng-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--local"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Airflow DAG processor — parses DAG files
  # ---------------------------------------------------------------------------
  airflow-dag-processor:
    <<: *airflow-common
    container_name: deng-airflow-dag-processor
    command: dag-processor
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Airflow triggerer — handles deferred tasks and sensors
  # ---------------------------------------------------------------------------
  airflow-triggerer:
    <<: *airflow-common
    container_name: deng-airflow-triggerer
    command: triggerer
    restart: unless-stopped
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # dbt — dedicated container for interactive dbt development
  # stays running so you can: docker compose exec dbt dbt run
  # ---------------------------------------------------------------------------
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest
    container_name: deng-dbt
    restart: unless-stopped
    entrypoint: ["tail", "-f", "/dev/null"]
    working_dir: /dbt
    environment:
      DBT_ANALYTICS_HOST: analytics-db
      DBT_ANALYTICS_PORT: "5432"
      DBT_ANALYTICS_USER: ${ANALYTICS_DB_USER}
      DBT_ANALYTICS_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      DBT_ANALYTICS_DB: ${ANALYTICS_DB_NAME}
    volumes:
      - ./dbt_project:/dbt
      - ./dbt_project/profiles.yml:/root/.dbt/profiles.yml:ro
    depends_on:
      analytics-db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Superset metadata database — internal Superset state only
  # ---------------------------------------------------------------------------
  superset-db:
    image: postgres:16
    container_name: deng-superset-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SUPERSET_DB_USER}
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD}
      POSTGRES_DB: ${SUPERSET_DB_NAME}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5434:5432"
    volumes:
      - /data/volumes/superset_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPERSET_DB_USER} -d ${SUPERSET_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Superset init — runs once to migrate DB and create admin user
  # ---------------------------------------------------------------------------
  superset-init:
    build: ./docker/superset
    container_name: deng-superset-init
    restart: "no"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DB_USER: ${SUPERSET_DB_USER}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      SUPERSET_DB_NAME: ${SUPERSET_DB_NAME}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
    volumes:
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    command:
      - /bin/bash
      - -c
      - |
        superset db upgrade &&
        superset init &&
        superset fab create-admin \
          --username ${SUPERSET_ADMIN_USER} \
          --password ${SUPERSET_ADMIN_PASSWORD} \
          --firstname Admin \
          --lastname User \
          --email ${SUPERSET_ADMIN_EMAIL} || true
    depends_on:
      superset-db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Superset — dashboards and visualisation
  # ---------------------------------------------------------------------------
  superset:
    build: ./docker/superset
    container_name: deng-superset
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DB_USER: ${SUPERSET_DB_USER}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      SUPERSET_DB_NAME: ${SUPERSET_DB_NAME}
    ports:
      - "8088:8088"
    volumes:
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    depends_on:
      superset-db:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===========================================================================
  # DATAHUB — metadata platform (production architecture)
  # UI:  http://192.168.1.93:9002  (login: datahub / datahub)
  # GMS: http://192.168.1.93:8090  (REST API — used by ingestion recipes)
  #
  # Architecture (2026 official):
  #   KRaft Kafka (no ZooKeeper) + OpenSearch + internal schema registry
  #   system-update replaces all separate setup containers
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # DataHub MySQL — DataHub internal metadata store
  # ---------------------------------------------------------------------------
  datahub-mysql:
    image: mysql:8.2
    container_name: deng-datahub-mysql
    restart: unless-stopped
    hostname: datahub-mysql
    environment:
      MYSQL_DATABASE: datahub
      MYSQL_USER: datahub
      MYSQL_PASSWORD: datahub
      MYSQL_ROOT_PASSWORD: datahub
      MYSQL_ROOT_HOST: '%'
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_bin
      --default-authentication-plugin=caching_sha2_password
    volumes:
      - datahub-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h datahub-mysql -u datahub --password=datahub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # DataHub OpenSearch — search and graph index (replaces Elasticsearch)
  # ---------------------------------------------------------------------------
  datahub-opensearch:
    image: opensearchproject/opensearch:2.19.3
    container_name: deng-datahub-opensearch
    restart: unless-stopped
    hostname: datahub-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      ES_JAVA_OPTS: -Xms512m -Xmx512m -Dlog4j2.formatMsgNoLookups=true
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m -Dlog4j2.formatMsgNoLookups=true
    volumes:
      - datahub-opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=0s"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------------------------
  # DataHub Kafka broker — KRaft mode (no ZooKeeper)
  # ---------------------------------------------------------------------------
  datahub-broker:
    image: confluentinc/cp-kafka:8.0.0
    container_name: deng-datahub-broker
    restart: unless-stopped
    hostname: datahub-broker
    command:
      - /bin/bash
      - -c
      - |
        file_path="/var/lib/kafka/data/clusterID"
        if [ ! -f "$$file_path" ]; then
          /bin/kafka-storage random-uuid > $$file_path
          kafka-storage format --ignore-formatted -t $$(cat "$$file_path") -c /etc/kafka/kafka.properties
        fi
        export CLUSTER_ID=$$(cat "$$file_path")
        /etc/confluent/docker/run
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller, broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@datahub-broker:39092
      KAFKA_LISTENERS: BROKER://datahub-broker:29092,EXTERNAL://datahub-broker:9092,CONTROLLER://datahub-broker:39092
      KAFKA_ADVERTISED_LISTENERS: BROKER://datahub-broker:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      KAFKA_CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
      KAFKA_MESSAGE_MAX_BYTES: "5242880"
      KAFKA_MAX_MESSAGE_BYTES: "5242880"
      KAFKA_LOG4J_LOGGERS: org.apache.kafka.image.loader.MetadataLoader=WARN
    ports:
      - "9092:9092"
    volumes:
      - datahub-broker:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z datahub-broker 9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # DataHub System Update — one-shot: creates MySQL schema, OpenSearch indices,
  # Kafka topics, and runs all upgrade steps. Replaces mysql-setup,
  # elasticsearch-setup, kafka-setup, and datahub-upgrade from previous setup.
  # ---------------------------------------------------------------------------
  datahub-system-update:
    image: acryldata/datahub-upgrade:head
    container_name: deng-datahub-system-update
    restart: "no"
    hostname: datahub-system-update
    command: ["-u", "SystemUpdate"]
    depends_on:
      datahub-mysql:
        condition: service_healthy
      datahub-opensearch:
        condition: service_healthy
      datahub-broker:
        condition: service_healthy
    environment:
      ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-gms/resources/entity-registry.yml
      EBEAN_DATASOURCE_HOST: datahub-mysql:3306
      EBEAN_DATASOURCE_USERNAME: datahub
      EBEAN_DATASOURCE_PASSWORD: datahub
      EBEAN_DATASOURCE_URL: jdbc:mysql://datahub-mysql:3306/datahub?verifyServerCertificate=false&useSSL=true&useUnicode=yes&characterEncoding=UTF-8&enabledTLSProtocols=TLSv1.2
      EBEAN_DATASOURCE_DRIVER: com.mysql.jdbc.Driver
      DATAHUB_SQL_SETUP_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVER: datahub-broker:29092
      KAFKA_SCHEMAREGISTRY_URL: http://datahub-gms:8080/schema-registry/api/
      SCHEMA_REGISTRY_TYPE: INTERNAL
      SCHEMA_REGISTRY_SYSTEM_UPDATE: "true"
      SPRING_KAFKA_PROPERTIES_AUTO_REGISTER_SCHEMAS: "true"
      SPRING_KAFKA_PROPERTIES_USE_LATEST_VERSION: "true"
      USE_CONFLUENT_SCHEMA_REGISTRY: "false"
      DATAHUB_PRECREATE_TOPICS: "true"
      ELASTICSEARCH_HOST: datahub-opensearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_USE_SSL: "false"
      ELASTICSEARCH_IMPLEMENTATION: opensearch
      ELASTICSEARCH_INDEX_BUILDER_MAPPINGS_REINDEX: "true"
      ELASTICSEARCH_INDEX_BUILDER_SETTINGS_REINDEX: "true"
      ELASTICSEARCH_INDEX_BUILDER_REFRESH_INTERVAL_SECONDS: "3"
      ELASTICSEARCH_BUILD_INDICES_CLONE_INDICES: "false"
      GRAPH_SERVICE_IMPL: elasticsearch
      ENTITY_VERSIONING_ENABLED: "true"
      DATAHUB_TOKEN_SERVICE_SIGNING_KEY: ${DATAHUB_TOKEN_SERVICE_SIGNING_KEY}
      DATAHUB_TOKEN_SERVICE_SALT: ${DATAHUB_TOKEN_SERVICE_SALT}
    labels:
      datahub_setup_job: "true"

  # ---------------------------------------------------------------------------
  # DataHub GMS — backend metadata service
  # Exposed on 8090 externally (8080 is taken by Airflow)
  # Internally reachable as http://datahub-gms:8080
  # ---------------------------------------------------------------------------
  datahub-gms:
    image: acryldata/datahub-gms:head
    container_name: deng-datahub-gms
    restart: unless-stopped
    hostname: datahub-gms
    depends_on:
      datahub-system-update:
        condition: service_completed_successfully
    ports:
      - "8090:8080"
    environment:
      ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-gms/resources/entity-registry.yml
      EBEAN_DATASOURCE_HOST: datahub-mysql:3306
      EBEAN_DATASOURCE_USERNAME: datahub
      EBEAN_DATASOURCE_PASSWORD: datahub
      EBEAN_DATASOURCE_URL: jdbc:mysql://datahub-mysql:3306/datahub?verifyServerCertificate=false&useSSL=true&useUnicode=yes&characterEncoding=UTF-8&enabledTLSProtocols=TLSv1.2
      EBEAN_DATASOURCE_DRIVER: com.mysql.jdbc.Driver
      KAFKA_BOOTSTRAP_SERVER: datahub-broker:29092
      KAFKA_SCHEMAREGISTRY_URL: http://datahub-gms:8080/schema-registry/api/
      SCHEMA_REGISTRY_TYPE: INTERNAL
      ELASTICSEARCH_HOST: datahub-opensearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_USE_SSL: "false"
      ELASTICSEARCH_IMPLEMENTATION: opensearch
      ELASTICSEARCH_INDEX_BUILDER_MAPPINGS_REINDEX: "true"
      ELASTICSEARCH_INDEX_BUILDER_SETTINGS_REINDEX: "true"
      GRAPH_SERVICE_IMPL: elasticsearch
      METADATA_SERVICE_AUTH_ENABLED: "false"
      MAE_CONSUMER_ENABLED: "true"
      MCE_CONSUMER_ENABLED: "true"
      PE_CONSUMER_ENABLED: "true"
      UI_INGESTION_ENABLED: "true"
      ENTITY_SERVICE_ENABLE_RETENTION: "true"
      ENTITY_VERSIONING_ENABLED: "true"
      SHOW_ACCESS_MANAGEMENT: "true"
      THEME_V2_ENABLED: "true"
      THEME_V2_DEFAULT: "true"
      SHOW_HOME_PAGE_REDESIGN: "true"
      SHOW_INGESTION_PAGE_REDESIGN: "true"
      POLICY_CACHE_REFRESH_INTERVAL_SECONDS: "120"
      DATAHUB_TOKEN_SERVICE_SIGNING_KEY: ${DATAHUB_TOKEN_SERVICE_SIGNING_KEY}
      DATAHUB_TOKEN_SERVICE_SALT: ${DATAHUB_TOKEN_SERVICE_SALT}
      JAVA_OPTS: -Xms512m -Xmx1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ---------------------------------------------------------------------------
  # DataHub Actions — event-driven automation (doc propagation, ingestion executor)
  # ---------------------------------------------------------------------------
  datahub-actions:
    build: ./docker/datahub-actions
    container_name: deng-datahub-actions
    restart: unless-stopped
    hostname: datahub-actions
    depends_on:
      datahub-gms:
        condition: service_healthy
    volumes:
      - ./datahub:/datahub:ro
    environment:
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8080"
      DATAHUB_GMS_PROTOCOL: http
      DATAHUB_SYSTEM_CLIENT_ID: __datahub_system
      DATAHUB_SYSTEM_CLIENT_SECRET: JohnSnowKnowsNothing
      KAFKA_BOOTSTRAP_SERVER: datahub-broker:29092
      KAFKA_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
      SCHEMA_REGISTRY_URL: http://datahub-gms:8080/schema-registry/api/
      METADATA_AUDIT_EVENT_NAME: MetadataAuditEvent_v4
      METADATA_CHANGE_LOG_VERSIONED_TOPIC_NAME: MetadataChangeLog_Versioned_v1
      METADATA_SERVICE_AUTH_ENABLED: "false"
      ELASTICSEARCH_HOST: datahub-opensearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_USE_SSL: "false"
      # Ingestion recipe credentials — passed through from .env
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}

  # ---------------------------------------------------------------------------
  # DataHub Frontend — web UI
  # ---------------------------------------------------------------------------
  datahub-frontend:
    image: acryldata/datahub-frontend-react:head
    container_name: deng-datahub-frontend
    restart: unless-stopped
    hostname: datahub-frontend-react
    depends_on:
      datahub-gms:
        condition: service_healthy
    ports:
      - "9002:9002"
    environment:
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8080"
      DATAHUB_SECRET: ${DATAHUB_TOKEN_SERVICE_SIGNING_KEY}
      DATAHUB_TOKEN_SERVICE_SIGNING_KEY: ${DATAHUB_TOKEN_SERVICE_SIGNING_KEY}
      DATAHUB_TOKEN_SERVICE_SALT: ${DATAHUB_TOKEN_SERVICE_SALT}
      AUTH_SESSION_TTL_HOURS: "24"
      MAX_SESSION_TOKEN_AGE: 24h
      THEME_V2_DEFAULT: "true"
      METADATA_SERVICE_AUTH_ENABLED: "false"
      JAVA_OPTS: >-
        -Xms512m -Xmx512m
        -Dhttp.port=9002
        -Dconfig.file=datahub-frontend/conf/application.conf
        -Djava.security.auth.login.config=datahub-frontend/conf/jaas.conf
        -Dlogback.configurationFile=datahub-frontend/conf/logback.xml
        -Dlogback.debug=false
        -Dpidfile.path=/dev/null
    volumes:
      - /srv/deng-hydro-climate/datahub/user.props:/datahub-frontend/conf/user.props
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail http://localhost:9002/api/v2/auth/me || true"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # FastAPI — public REST API (hydro + meteo observations)
  # Exposed on 8000 externally, reverse-proxied via Caddy at api.deng.ee
  # ---------------------------------------------------------------------------
  fastapi:
    build: ./docker/fastapi
    container_name: deng-fastapi
    restart: unless-stopped
    environment:
      ANALYTICS_DB_HOST: analytics-db
      ANALYTICS_DB_PORT: "5432"
      ANALYTICS_DB_NAME: ${ANALYTICS_DB_NAME}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      RATE_LIMIT: "60/minute"
    ports:
      - "8000:8000"
    depends_on:
      analytics-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # CKAN — open data catalogue
  # UI: http://192.168.1.93:5000 — public via https://ckan.deng.ee
  # Admin credentials via .env — CKAN_ADMIN_USER / CKAN_ADMIN_PASSWORD
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # CKAN database — dedicated PostgreSQL instance for CKAN internal state
  # ---------------------------------------------------------------------------
  ckan-db:
    image: postgres:16
    container_name: deng-ckan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ckan
      POSTGRES_PASSWORD: ${CKAN_DB_PASSWORD}
      POSTGRES_DB: ckan
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5435:5432"
    volumes:
      - ckan-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ckan -d ckan"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # CKAN Solr — search index (pre-configured schema for CKAN 2.11)
  # Internal only — not exposed externally
  # ---------------------------------------------------------------------------
  ckan-solr:
    image: ckan/ckan-solr:2.11-solr9
    container_name: deng-ckan-solr
    restart: unless-stopped
    volumes:
      - ckan-solr-data:/var/solr
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail http://localhost:8983/solr/ckan/admin/ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # CKAN Redis — job queue and caching
  # Internal only — not exposed externally
  # ---------------------------------------------------------------------------
  ckan-redis:
    image: redis:7-alpine
    container_name: deng-ckan-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # CKAN — open data catalogue application
  # Exposed on 5000, reverse-proxied via Caddy at ckan.deng.ee
  # Extensions: hierarchy, dcat (DCAT-AP 3), scheming, spatial
  # ---------------------------------------------------------------------------
  ckan:
    build: ./docker/ckan
    container_name: deng-ckan
    restart: unless-stopped
    depends_on:
      ckan-db:
        condition: service_healthy
      ckan-solr:
        condition: service_healthy
      ckan-redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      CKAN_SQLALCHEMY_URL: postgresql://ckan:${CKAN_DB_PASSWORD}@ckan-db/ckan
      CKAN_DATASTORE_WRITE_URL: postgresql://ckan:${CKAN_DB_PASSWORD}@ckan-db/ckan
      CKAN_SOLR_URL: http://ckan-solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://ckan-redis:6379/1
      CKAN_SITE_URL: https://ckan.deng.ee
      CKAN_SITE_TITLE: "DENG Hydro-Climate Open Data"
      CKAN__SITE_DESCRIPTION: "Hydrological and meteorological open data from Estonian monitoring stations, published by Keskkonnaagenuur."
      CKAN__SITE_INTRO_TEXT: "Open access to water level, discharge, and climate observations across Estonia."
      CKAN__AUTH__CREATE_USER_VIA_WEB: "false"
      CKAN_SYSADMIN_NAME: ${CKAN_ADMIN_USER}
      CKAN_SYSADMIN_PASSWORD: ${CKAN_ADMIN_PASSWORD}
      CKAN_SYSADMIN_EMAIL: ${CKAN_ADMIN_EMAIL}
      CKAN_SECRET_KEY: ${CKAN_SECRET_KEY}
      TZ: "Europe/Tallinn"
      # Locale — Estonian default, English offered
      CKAN__LOCALE_DEFAULT: "en"
      CKAN__LOCALES_OFFERED: "en et"
      CKAN__DISPLAY_TIMEZONE: "Europe/Tallinn"
      # Default licence — CC BY 4.0
      CKAN__DEFAULT_DATASET_LICENCE: "cc-by"
      # Plugins — order matters per ckanext-dcat docs
      CKAN__PLUGINS: "image_view text_view datatables_view datastore spatial_metadata spatial_query dcat scheming_datasets hierarchy_display hierarchy_form envvars"
      CKAN___SCHEMING__DATASET_SCHEMAS: "ckanext.dcat.schemas:dcat_ap_full.yaml"
      CKAN___SCHEMING__PRESETS: "ckanext.scheming:presets.json ckanext.dcat.schemas:presets.yaml"
      # DCAT-AP 3 profile
      CKANEXT__DCAT__RDF_PROFILES: "euro_dcat_ap_3"
      CKANEXT__DCAT__DEFAULT_CATALOG_ENDPOINT: "/catalog.{_format}"
      # Spatial — solr backend (no PostGIS required)
      CKANEXT__SPATIAL__SEARCH_BACKEND: "solr-bbox"
    volumes:
      - ckan-storage-data:/var/lib/ckan
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/3/action/status_show')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
